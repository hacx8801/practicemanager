<!DOCTYPE html>
<html lang="en" class="background-image">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Manager</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <main>
        <div class="edit-container">
            <div class="edit-dialog">
                <div class="edit-details">
                    <legend>Edit...</legend>
                    <label for="edit-title">Track Title:
                        <input type="text" id="edit-title" class="edit-input"/>
                    </label>
                    <div class="flex-container">
                        <label for="edit-bpm">BPM:
                            <div class="edit-bpm-container">
                            <input type="number" min="0" max="220" id="edit-bpm" class="edit-input"/>
                            </div>
                        </label>
                        <label for="edit-time">Time:
                            <span id="edit-time">
                                <input type="text" class="edit-input"/>
                            </span>
                        </label>
                    </div>
                    <button id="edit-save">Save</button>
                    <button id="edit-close">Cancel</button>

                </div>
                <select class="edit-list" multiple>
                </select>
            </div>
        </div>
        <div class="shadow-container">
            <div class="ui-container">
                <div class="files-container">
                    <button id="export-btn">Export ⤒</button>
                    <button id="import-btn">Import ⤓</button>
                    <button id="edit-btn">Edit ✐</button>
                </div>
                    <p id="exercise-title">Placeholder Title</p>
                    <div class="timer-container">
                    <button class="timer-btn" id="decrement">-</button>
                    <p class="timer-clock">0:00</p>
                    <button class="timer-btn" id="increment">+</button>
                </div>
                <div class="metronome-container">
                    <p class="metronome-bpm">0</p>
                    <div class="metronome-buttons">
                        <button id="up-btn">⏶</button>
                        <button id="down-btn">⏷</button>
                    </div>
                    <label class="metronome-label" >bpm</label>
                </div>
            </div>
            <div class="controls-container">
                <button class="controls-btn" id="previous">&#9198;</button>
                <button class="controls-btn" id="playpause">&#9199;</button>
                <button class="controls-btn" id="next">&#9197;</button>
            </div>
        </div>
    </main>
</body>
<script src="script.js"></script>
</html>
